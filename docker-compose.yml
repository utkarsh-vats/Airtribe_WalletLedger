name: walletledger

# Host ports are chosen via .env so they can't clash with other projects on this machine.
# Postgres and Redis always bind to 127.0.0.1; the API binds to API_BIND_HOST (default
# 127.0.0.1). Docker-published ports bypass UFW, so bind to a specific interface, never 0.0.0.0.
# Every variable has a local-dev default, so a fresh clone runs with plain `docker compose up`;
# .env is an optional override. Every service has a memory limit.

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-walletledger}
      # Local-only dev default; Postgres is bound to 127.0.0.1. Override in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walletledger}
      POSTGRES_DB: ${POSTGRES_DB:-walletledger}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-walletledger_test}
      # Application roles, created by docker/postgres/initdb on first volume init.
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:-wallet_app}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      # Runs only when the data volume is created; changing it needs a fresh volume.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      # TCP, not the Unix socket: on first init the image runs a temporary socket-only server for
      # the initdb scripts, then restarts. A socket check passes during that window and lets
      # `migrate` connect while the real server is still starting ("database system is starting up").
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations to the dev and the test database, then exits.
  migrate:
    build: .
    image: walletledger-api:dev
    command:
      - sh
      - -c
      - alembic upgrade head && alembic -x target=test upgrade head && python -m app.auth.admin_seed
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://wallet_owner:${WALLET_OWNER_PASSWORD:-wallet_owner}@postgres:5432/${POSTGRES_DB:-walletledger}
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://wallet_owner:${WALLET_OWNER_PASSWORD:-wallet_owner}@postgres:5432/${POSTGRES_TEST_DB:-walletledger_test}
      # Admin seed for the dev database; skipped when unset (no default admin).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-+910000000000}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  api:
    build: .
    image: walletledger-api:dev
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Runtime role, not the superuser.
      DATABASE_URL: postgresql+asyncpg://wallet_app:${WALLET_APP_PASSWORD:-wallet_app}@postgres:5432/${POSTGRES_DB:-walletledger}
      REDIS_URL: redis://redis:6379/0
      # Dev default mirrors app/config.py; the app refuses it when APP_ENV=prod.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
