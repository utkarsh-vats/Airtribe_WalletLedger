[project]
name = "walletledger"
version = "0.1.0"
description = "Payments-grade wallet backend with a double-entry ledger"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "celery[redis]==5.7.0",
    "email-validator==2.4.0",
    "fastapi==0.163.2",
    "google-genai==3.5.0",
    "pydantic-settings==2.16.3",
    "pyjwt==2.15.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts; fixed test-only keys and passwords

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
